include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    # The example app has its own analysis_options.yaml.
    - example/**
    # Generated by ffigen from the PDFium headers.
    - lib/src/engines/pdfium/pdfium_bindings.g.dart

linter:
  rules:
    # Every public member is documented: the package is read by its users.
    - public_member_api_docs
