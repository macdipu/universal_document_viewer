name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze the package
        run: flutter analyze
      - name: Analyze and test the example
        working-directory: example
        run: flutter pub get && flutter analyze && flutter test test
      - name: Test
        # The build hook downloads the pinned PDFium for the host on the first run.
        run: flutter test

  pana:
    name: pub.dev score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate pana
      - name: pana
        run: dart pub global run pana --no-warning --exit-code-threshold 0
